name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede stale runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runners are pinned to ubuntu-26.04 (NOT `ubuntu-latest`): a floating image is a
# silent explosion waiting for GitHub's next bump. 26.04 is the newest LTS — if it
# breaks it's a clean upstream bug report, which is the point. Bump by hand.
env:
  LAKE_ARTIFACT_CACHE: true
  LAKE_RESTORE_ARTIFACTS: true
  LAKE_NO_CACHE: true

jobs:
  # Build GoodsteinPA, run the shake gate on the freshly built oleans, and generate the import
  # graph, all sharing the one build.  Dependencies come prebuilt: mathlib from `cache get`,
  # Foundation and AlphaCentauri from FFL's shared Lake cache (see .github/actions/setup-lean and
  # lake-cache.toml), so a dependency bump no longer means compiling Foundation from source.
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lean

      # ── GoodsteinPA's own build cache (`lake pack`/`unpack`) ───────────────────────────────────────
      # Orthogonal to the Foundation cache above: `lake pack` archives ONLY the root package's
      # `.lake/build` (GoodsteinPA's own oleans), never the dependency trees. Restoring + unpacking
      # it lets `lake build` reuse traces and rebuild only the modules that actually changed, instead
      # of recompiling all of GoodsteinPA every run. The key pins toolchain+manifest (so a Foundation
      # bump busts it) and appends sha to dodge cache-key reservation races; restore-keys fall back to
      # the newest cache with a matching toolchain+manifest.
      - name: Restore GoodsteinPA build cache
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/GoodsteinPA-x86_64-unknown-linux-gnu.tar.gz
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Unpack GoodsteinPA build cache
        if: hashFiles('.lake/GoodsteinPA-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      - name: Build GoodsteinPA
        run: lake build

      # Re-pack the freshly built oleans and save under the exact primary key. Skipped for PRs from
      # forks (no write access to the base repo's cache); pushes and same-repo PRs refresh the entry.
      - name: Pack GoodsteinPA build cache
        run: lake pack
      - name: Save GoodsteinPA build cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@v4
        with:
          path: .lake/GoodsteinPA-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.project-cache.outputs.cache-primary-key }}

      # Every declaration may use only the axioms `forgive.yml` accepts.
      - name: Audit axioms
        run: lake exe forgive GoodsteinPA

      # Blueprint status gate: reconcile each `@[goodstein_blueprint]` claim against its real footprint.
      # - name: Blueprint status gate (collectAxioms vs claim)
      #   run: |
      #     set -euo pipefail
      #     lake build GoodsteinPABlueprint blueprint_audit
      #     lake exe blueprint_audit blueprint/trusted-axioms.txt

      - uses: extractions/setup-just@v3

      # shake reads the just-built oleans to find unused imports, so it must run after `lake build`.
      - name: Check shake applied (no unused imports)
        run: |
          just shake
          if [ -n "$(git diff)" ]; then
            echo "Unused imports found. Please run 'just shake' and commit the changes."
            exit 1
          fi

      - uses: ts-graphviz/setup-graphviz@v2
      - name: Generate import graph
        run: just import-graph

      - name: Upload lean artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lean-artifacts
          path: |
            import_graph.png
            import_graph.pdf
            import_graph.html
          retention-days: 1
          include-hidden-files: true

  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just references
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just references' and commit the changes."
            exit 1
          fi

  # mk_all only scans the source tree (no build), so it runs as its own lightweight job.
  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Generate page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - check-references
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download lean artifacts
        uses: actions/download-artifact@v8
        with:
          name: lean-artifacts
      - name: Copy from artifacts to pages
        run: |
          mkdir -p pages
          cp "$GITHUB_WORKSPACE/import_graph.png" \
             "$GITHUB_WORKSPACE/import_graph.pdf" \
             "$GITHUB_WORKSPACE/import_graph.html" \
             pages/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
